name: Observe St James's Park

# Hourly: refresh "today so far" and back-fill any missed days.
# Just after UK midnight: finalise yesterday's verdict. Cron is in UTC, so two
# entries cover 00:20 UK time in both GMT (00:20 UTC) and BST (23:20 UTC); the
# pipeline works out the UK date itself, so an extra run is harmless.
on:
  schedule:
    - cron: '7 * * * *'
    - cron: '20 0 * * *'
    - cron: '20 23 * * *'
  workflow_dispatch:
    inputs:
      backfill_from:
        description: 'Optional: re-finalise days from this UK date (YYYY-MM-DD)'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: observe
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run pipeline
        id: pipeline
        env:
          DATAHUB_API_KEY: ${{ secrets.DATAHUB_API_KEY }}
        run: |
          set +e
          if [ -n "${{ inputs.backfill_from }}" ]; then
            npx tsx pipeline/run.ts --backfill-from "${{ inputs.backfill_from }}"
          else
            npx tsx pipeline/run.ts
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit data
        id: commit
        if: always()
        run: |
          git config user.name "snow-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: observations $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((2 ** i))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on pipeline error
        if: steps.pipeline.outputs.exit_code != '0'
        run: |
          case "${{ steps.pipeline.outputs.exit_code }}" in
            2) echo "::error::Station identity check failed: no verdict was published.";;
            3) echo "::error::Every data source failed.";;
            *) echo "::error::Pipeline exited with code ${{ steps.pipeline.outputs.exit_code }}.";;
          esac
          exit 1

      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Snow Watch pipeline failing"
          body="The observation workflow failed at $(date -u +%Y-%m-%dT%H:%MZ). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi

  deploy:
    needs: observe
    if: always() && needs.observe.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
